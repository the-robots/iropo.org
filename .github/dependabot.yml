version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
