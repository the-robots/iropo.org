name: Refresh FBI data

# The FBI's Crime Data Explorer refreshes mid-month; check shortly after and propose any changes
# as a pull request so a person reviews every data update before it is published.
on:
  schedule:
    - cron: "17 13 18 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install pipeline
        working-directory: pipeline
        run: uv sync --locked

      - name: Fetch, build and validate
        working-directory: pipeline
        env:
          # Optional: with a key the documented api.usa.gov gateway is used; without one the
          # public Crime Data Explorer backend is used.
          FBI_API_KEY: ${{ secrets.FBI_API_KEY }}
        run: uv run iropo-data all --refresh

      - name: Run tests against the new data
        working-directory: pipeline
        run: uv run pytest

      # Pull requests opened with GITHUB_TOKEN do not trigger CI, so check the site here.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check and build the site with the new data
        run: |
          npm ci
          npm run check
          npm run build

      - name: Summarize
        run: |
          {
            echo "## Data refresh"
            echo
            echo '```json'
            cat data/processed/meta.json
            echo '```'
            echo
            git diff --stat -- data/processed | tail -n 5
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/refresh-fbi-data
          delete-branch: true
          add-paths: data/processed
          commit-message: "Refresh FBI animal cruelty data"
          title: "Refresh FBI animal cruelty data"
          body: |
            Automated monthly refresh of `data/processed` from the FBI Crime Data Explorer.

            - Review `data/processed/meta.json` for the new retrieval date and counts.
            - Spot-check a few state pages locally with `npm run dev`.

            Generated by the **Refresh FBI data** workflow.
