[project]
name = "iropo-pipeline"
version = "0.2.0"
description = "Data pipeline that builds IROPO's source-of-truth datasets from official FBI Crime Data Explorer sources."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "openpyxl>=3.1.5",
    "requests>=2.32",
    "xlrd>=2.0.1",
]

[project.scripts]
iropo-data = "iropo_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iropo_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
